name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify every level (solvable, 3-star, needs ink, robust to imprecise drawing)
        run: npm run verify
      - name: Fuzz the simulation
        run: npx tsx scripts/fuzz-sim.ts 60
      - run: npm run build
      - run: npm run build:single
